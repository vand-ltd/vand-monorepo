<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" role="img" aria-label="Advertise here on Menyesha">
  <title>Advertise here</title>
  <defs>
    <linearGradient id="ah-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00243e"/>
      <stop offset="55%" stop-color="#003153"/>
      <stop offset="100%" stop-color="#005F73"/>
    </linearGradient>
    <radialGradient id="ah-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card -->
  <rect x="0" y="0" width="600" height="160" rx="22" fill="url(#ah-bg)"/>
  <circle cx="540" cy="10" r="170" fill="url(#ah-glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Broadcast signal: a dot + arcs that gently pulse (calm, on-brand) -->
  <g transform="translate(66,80)">
    <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
    <path d="M 18 -12 A 16 16 0 0 1 18 12" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 -20 A 26 26 0 0 1 30 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.25;0.85" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 42 -28 A 36 36 0 0 1 42 28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Copy -->
  <text x="170" y="74" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#ffffff">ADVERTISE HERE</text>
  <text x="170" y="104" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="0.5" fill="#F59E0B">Reach Rwanda&#8217;s fans &#8212; vand.rw</text>

  <!-- CTA pill -->
  <g transform="translate(170,120)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#F59E0B"/>
    <text x="16" y="20" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#00243e">Get in touch &#8594;</text>
  </g>
</svg>
