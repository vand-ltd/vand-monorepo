<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 50" width="320" height="50" role="img" aria-label="Advertise here on Tugezo">
  <title>Advertise here</title>
  <defs>
    <linearGradient id="ahm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00243e"/>
      <stop offset="55%" stop-color="#003153"/>
      <stop offset="100%" stop-color="#005F73"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="50" rx="10" fill="url(#ahm-bg)"/>

  <!-- Signal (small) -->
  <g transform="translate(24,25) scale(0.5)">
    <circle cx="0" cy="0" r="6" fill="#F59E0B"/>
    <path d="M 15 -10 A 14 14 0 0 1 15 10" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M 26 -17 A 23 23 0 0 1 26 17" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Copy -->
  <text x="52" y="31" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="0.6" fill="#ffffff">ADVERTISE HERE</text>
  <text x="306" y="31" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F59E0B">vand.rw &#8594;</text>
</svg>
